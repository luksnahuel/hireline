name: CI

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 25.0.5.1+2

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      - run: ./gradlew test
