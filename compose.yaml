# Local development only. Keep the image tag in sync with gradle/libs.versions.toml.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: hireline
      POSTGRES_USER: hireline
      POSTGRES_PASSWORD: hireline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: on first run, the init server listens only on the Unix socket.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U hireline -d hireline -tAc 'SELECT 1'"]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
